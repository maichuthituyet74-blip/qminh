<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lovely</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #151515;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e0e0e0;
        }

        /* Màn hình khóa bắt buộc xoay ngang giống hệt trang gốc */
        #rotate-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #151515;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .phone-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 20px;
            fill: #a0a0a0;
            animation: rotatePhone 2.3s ease-in-out infinite;
        }
        #rotate-overlay h2 {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        #rotate-overlay p {
            font-size: 0.95rem;
            opacity: 0.6;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            40% { transform: rotate(-90deg); }
            70% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        /* Giao diện chính */
        #main-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #151515;
        }

        /* Khung chứa Sticker động ở trung tâm */
        #sticker-container {
            margin-bottom: 20px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 120px;
        }
        
        /* Đồ họa Sticker hoạt họa nhịp tim đập nhẹ mượt mà */
        .animated-heart {
            width: 90px;
            height: 90px;
            animation: pulseSticker 1.4s ease-in-out infinite alternate;
        }

        @keyframes pulseSticker {
            0% { transform: scale(0.93); filter: drop-shadow(0 0 5px rgba(245,132,183,0.2)); }
            100% { transform: scale(1.07); filter: drop-shadow(0 0 20px rgba(245,132,183,0.5)); }
        }

        /* Khung hiển thị lời nhắn nhủ dịch chuyển mượt mà */
        #message-box {
            z-index: 10;
            text-align: center;
            max-width: 85%;
            padding: 10px;
        }
        .message-line {
            font-size: 1.75rem;
            font-weight: 400;
            color: #e5e5e5;
            margin: 12px 0;
            min-height: 2.2rem;
            letter-spacing: 0.5px;
            line-height: 1.4;
            opacity: 0.95;
        }
        
        /* Dòng chữ cuối làm nổi bật bằng tone màu hồng mộng mơ */
        #line4 {
            color: #f584b7;
            font-weight: 500;
        }

        /* Nhận diện góc xoay ngang để hiển thị */
        @media screen and (orientation: landscape) {
            #rotate-overlay { display: none; }
            #main-content { display: flex; }
        }
    </style>
</head>
<body>

    <!-- Giao diện cảnh báo xoay màn hình điện thoại -->
    <div id="rotate-overlay">
        <svg class="phone-icon" viewBox="0 0 24 24">
            <path d="M16 1H8C6.34 1 5 2.34 5 4v16c0 1.66 1.34 3 3 3h8c1.66 0 3-1.34 3-3V4c0-1.66-1.34-3-3-3zm-2 20h-4v-1h4v1zm3-3H7V4h10v14z"/>
        </svg>
        <h2>Rotate phone</h2>
        <p>Vui lòng xoay ngang màn hình!</p>
    </div>

    <!-- Giao diện chính của trang mẫu -->
    <div id="main-content">
        <!-- Sticker Trái tim hoạt họa vector sắc nét ở chính giữa màn hình -->
        <div id="sticker-container">
            <svg class="animated-heart" viewBox="0 0 100 100">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#f584b7" transform="scale(3.8) translate(2, 2)"/>
            </svg>
        </div>
        
        <!-- Khung chữ gõ máy xuất hiện tuần tự đúng nội dung yêu cầu -->
        <div id="message-box">
            <div id="line1" class="message-line"></div>
            <div id="line2" class="message-line"></div>
            <div id="line3" class="message-line"></div>
            <div id="line4" class="message-line"></div>
        </div>
    </div>

    <script>
        // Cấu hình nội dung hiển thị chính xác theo từng dòng chữ của bạn
        const config = {
            line1: "Hello cdangg ><",
            line2: "Nay cdangg có mệt khom .",
            line3: "Cdangg nhớ tui khom",
            line4: "Yeuu nhiều aaa💗"
        };

        // Hiệu ứng gõ chữ mượt và khựng nhẹ cơ học giống bản gốc
        function typeWriter(text, elementId, speed, delay, callback) {
            let i = 0;
            const element = document.getElementById(elementId);
            element.innerHTML = "";
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed); 
                } else if (callback) {
                    setTimeout(callback, delay);
                }
            }
            type();
        }

        // Chạy tuần tự và đồng bộ cả 4 dòng chữ
        function startLoveAnimation() {
            // Tốc độ gõ chữ 85ms/ký tự, khoảng nghỉ giữa các câu là 600ms giống hệt link gốc
            typeWriter(config.line1, "line1", 85, 600, () => {
                typeWriter(config.line2, "line2", 85, 600, () => {
                    typeWriter(config.line3, "line3", 85, 600, () => {
                        typeWriter(config.line4, "line4", 85, 600);
                    });
                });
            });
        }

        // Tự động kiểm tra trạng thái màn hình khi bắt đầu tải trang
        let animated = false;
        window.addEventListener('load', () => {
            if (window.innerWidth > window.innerHeight && !animated) {
                animated = true;
                startLoveAnimation();
            }
        });

        // Theo dõi sự kiện xoay màn hình để kích hoạt hiệu ứng chạy chữ kịp thời
        window.addEventListener('resize', () => {
            if (window.innerWidth > window.innerHeight && !animated) {
                animated = true;
                setTimeout(startLoveAnimation, 400); // Tạo độ trễ nhẹ khi lật màn hình cho mượt
            }
        });
    </script>
</body>
</html>
